selection:
  method: filter
  target: request_help
  number_of_features: 20
  high_correlation: 0.85
  drop_columns:
  - exercise_is_evaluation
  - valid_solution
  - finished_exercise
  - exercise_valid_solution
  - student_motivation
  - grade
  - tree_grade
  - solution_distance_family_distance
  - solution_distance_element_distance
  - solution_distance_position_distance
  - solution_distance_input_distance
  heatmap_correlation_path_before: dvc_plots/heatmap_correlation_before.png
  heatmap_correlation_path_after: dvc_plots/heatmap_correlation_after.png

model:
  distance_calculation_type: ARTIE
  mask_value: -1
  percentage_train_size: 70
  lstm_units: 256
  return_sequences: true
  second_lstm_layer: false
  use_dropouts: false
  use_bidirectional: false
  dropout_value: 0.5
  use_attention: true
  initial_learning_rate: 0.001
  training_epochs: 500
  training_batch_size: 16
  training_class_weights: true
  training_early_stopping_patience: 100
  training_reduce_lr_patience: 30
  training_reduce_lr_factor: 0.3
  show_summary: true
